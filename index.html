<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f766e"><title>名古屋クアトロ前 食事・昼飲みガイド</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""><style>

r(--radius);overflow:hidden}.map-title{display:flex;justify-content:space-between;padding:12px 14px;color:var(--muted);font-size:13px}#map{height:440px}.place-icon span{display:grid;place-items:center;width:32px;height:32px;border:3px solid #fff;border-radius:50%;box-shadow:0 2px 8px #0004;color:#fff;font-weight:800}.shop-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.shop-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}.shop-card.is-selected{outline:3px solid var(--accent)}.card-top{display:flex;gap:10px;justify-content:space-between}.card-top h3{margin:2px 0 0;font-size:19px;line-height:1.3}.specialty{margin:10px 0 2px;font-weight:700}.hours{margin:0;color:var(--muted);font-size:13px}.notice{margin:8px 0 0;padding:6px 8px;background:#fff5df;color:#8a5310;border-radius:7px;font-size:12px}.badges{display:flex;gap:6px;margin:12px 0}.badges span{padding:3px 7px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:12px}.scores{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin:0;border-top:1px solid var(--line);padding-top:10px;font-size:12px}.scores div{display:flex;justify-content:space-between}.scores dt{color:var(--muted)}.scores dd{margin:0;color:var(--accent);letter-spacing:-1px}.actions{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:7px;margin-top:14px}.actions>*{border:1px solid var(--line);border-radius:9px;padding:8px;text-align:center;background:#fff;color:var(--ink);font:13px inherit;text-decoration:none;cursor:pointer}.actions>a:nth-child(2){background:var(--accent);color:#fff;border-color:var(--accent)}.empty,.footer{color:var(--muted)}.jump{display:none}@media(max-width:700px){.wrap{padding:10px 10px 70px}.search-row{flex-wrap:wrap}.search-row input{flex-basis:100%}.search-row select,.search-row button{flex:1}.recommendations{grid-template-columns:1fr}#map{height:48svh}.shop-list{grid-template-columns:1fr}.jump{display:flex;position:fixed;ri </style></head><body><main class="wrap"><header class="hero"><p class="eyebrow">URBANQUA → NAGOYA CLUB QUATTRO</p><h1>ライブ前、どこで食べる？</h1><p>大須・上前津・矢場町・栄の名古屋めしと昼飲み。営業時間は土日祝基準です。</p></header><section class="controls"><div class="search-row"><input id="search" type="search" placeholder="店名・名物・住所で検索"><select id="sort"><option value="recommended">おすすめ順</option><option value="start">アーバンクアから近い順</option><option value="goal">クアトロから近い順</option><option value="current">現在地から近い順</option></select><button id="locate" type="button">現在地を使う</button></div><div class="filter-chips" id="filterChips"></div><small id="locationStatus"></small></section><section class="summary"><h2>今の条件ならこの3店</h2><strong id="count"></strong></section><section id="recommendations" class="recommendations"></section><section class="map-panel"><div class="map-title"><span>地図のピンとカードは連動します</span><span>S: アーバンクア / G: クアトロ</span></div><div id="map"></div></section><section id="shopList" class="shop-list"></section><p class="footer">店舗情報は2026年8月22日に確認。来店前に店舗情報を確認してください。</p></main><nav class="jump"><a href="#map">地図</a><a href="#shopList">一覧</a></nav><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script type="module" src="./app.js"></script></body></html>
